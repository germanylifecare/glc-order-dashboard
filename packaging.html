<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Packaging Dashboard — GLC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .packaging-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      background: #fff;
      border: 1px solid #eee;
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 16px;
    }
    .packaging-toolbar label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .order-checkbox {
      width: 18px;
      height: 18px;
      margin-right: 12px;
      margin-top: 4px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .bulk-action-bar {
      display: none;
      position: sticky;
      bottom: 16px;
      background: #1a1a1a;
      color: #fff;
      border-radius: 10px;
      padding: 14px 18px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      margin-top: 16px;
    }
    .bulk-action-bar.active { display: flex; }
    .bulk-action-bar span { font-weight: 600; }
  </style>
</head>
<body>
  <header class="dashboard-header">
    <div class="brand">
      <span class="brand__logo">GLC</span>
      <span>Packaging Dashboard</span>
    </div>
    <div class="header-actions">
      <span id="userEmail"></span>
      <button id="logoutBtn" class="btn">Logout</button>
    </div>
  </header>

  <main class="dashboard-main">
    <div class="stat-row">
      <div class="stat-card">
        <div class="stat-card__value" id="statConfirmed">0</div>
        <div class="stat-card__label">Confirmed (Pack korte hobe)</div>
      </div>
      <div class="stat-card">
        <div class="stat-card__value" id="statPacked">0</div>
        <div class="stat-card__label">Packed (Ready to Ship e jabe)</div>
      </div>
    </div>

    <div class="filter-tabs">
      <button class="filter-tab active" data-filter="all">All</button>
      <button class="filter-tab" data-filter="confirmed">Confirmed</button>
      <button class="filter-tab" data-filter="packed">Packed</button>
    </div>

    <div class="packaging-toolbar">
      <label>
        <input type="checkbox" id="selectAllCheckbox" />
        Select All
      </label>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <input type="text" id="searchInput" placeholder="Search by name / phone..." style="min-width:220px;" />
        <button id="refreshBtn" class="btn">Refresh</button>
        <button id="exportBtn" class="btn" disabled title="Coming soon">Export & Print</button>
      </div>
    </div>

    <div id="ordersList">Loading...</div>

    <div class="bulk-action-bar" id="bulkActionBar">
      <span id="selectedCount">0 selected</span>
      <button id="markPackedBtn" class="btn btn--primary">Mark Selected as Packed</button>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/packaging.js"></script>
</body>
</html>
