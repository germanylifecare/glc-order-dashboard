<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Packaging Dashboard — GLC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .order-checkbox {
      width: 18px;
      height: 18px;
      margin-right: 12px;
      margin-top: 4px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .status-badge--packed { background: rgba(47,111,219,0.15); color: var(--info-blue); }
    .select-all-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-dim);
      font-weight: 600;
      margin-bottom: 12px;
      cursor: pointer;
    }
    .bulk-action-bar {
      display: none;
      position: sticky;
      bottom: 16px;
      background: #1a1a1a;
      color: #fff;
      border-radius: var(--radius-sm);
      padding: 14px 18px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      margin-top: 16px;
      max-width: 1080px;
      margin-left: auto;
      margin-right: auto;
    }
    .bulk-action-bar.active { display: flex; }
    .bulk-action-bar span { font-weight: 600; }
  </style>
</head>
<body>
  <header class="dash-header">
    <div class="dash-header__inner">
      <div style="display:flex; align-items:center; gap:10px;">
        <span class="hero__brand-mark">GLC</span>
        <strong>Packaging Dashboard</strong>
      </div>
      <div class="dash-header__right">
        <span class="dash-header__email" id="userEmail"></span>
        <button id="logoutBtn" class="btn btn--ghost btn--sm">Logout</button>
      </div>
    </div>
  </header>

  <main class="dash-main">
    <div class="stat-row">
      <div class="stat-card">
        <span class="stat-card__num" id="statConfirmed">0</span>
        <div class="stat-card__label">Confirmed (Pack korte hobe)</div>
      </div>
      <div class="stat-card">
        <span class="stat-card__num" id="statPacked">0</span>
        <div class="stat-card__label">Packed (Ready to Ship e jabe)</div>
      </div>
      <div class="stat-card">
        <span class="stat-card__num" id="statReadyToShip">0</span>
        <div class="stat-card__label">Ready to Ship (Shipped hoye gese)</div>
      </div>
    </div>

    <div class="dash-toolbar">
      <div class="filter-tabs">
        <button class="filter-tab is-active" data-filter="all">All</button>
        <button class="filter-tab" data-filter="confirmed">Confirmed</button>
        <button class="filter-tab" data-filter="packed">Packed</button>
        <button class="filter-tab" data-filter="ready_to_ship">Ready to Ship</button>
      </div>
      <input type="text" id="searchInput" class="search-box" placeholder="Search by name / phone..." />
      <button id="refreshBtn" class="btn btn--ghost btn--sm">Refresh</button>
      <button id="shipAndPrintBtn" class="btn btn--ghost btn--sm" disabled>🚚 Ready to Ship + প্রিন্ট লেবেল</button>
    </div>

    <label class="select-all-row">
      <input type="checkbox" id="selectAllCheckbox" />
      Select All
    </label>

    <div class="orders-list" id="ordersList">Loading...</div>
  </main>

  <div class="bulk-action-bar" id="bulkActionBar">
    <span id="selectedCount">0 selected</span>
    <button id="markPackedBtn" class="btn btn--primary">Mark Selected as Packed</button>
    <button id="reprintBtn" class="btn btn--ghost" disabled>🖨️ লেবেল রিপ্রিন্ট</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/packaging.js"></script>
</body>
</html>
