<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLC Order Dashboard — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

<div class="login-card">
  <div class="login-brand">
    <span class="hero__brand-mark">GLC</span>
    <span class="login-brand__name">Order Dashboard</span>
  </div>

  <h1 class="login-title" data-i18n="loginTitle">সেলস টিম লগইন</h1>
  <p class="login-sub" data-i18n="loginSub">আপনার অ্যাকাউন্ট ইমেইল ও পাসওয়ার্ড দিয়ে লগইন করুন</p>

  <form id="loginForm">
    <div class="form-field">
      <label for="email" data-i18n="email">ইমেইল</label>
      <input type="email" id="email" required autocomplete="username">
    </div>
    <div class="form-field">
      <label for="password" data-i18n="password">পাসওয়ার্ড</label>
      <input type="password" id="password" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn--primary btn--block" id="loginBtn" data-i18n="loginBtn">লগইন করুন</button>
    <p id="loginStatus" class="form-status" role="status" aria-live="polite"></p>
  </form>

  <button id="langToggleBtn" class="btn btn--ghost btn--sm" style="margin-top:16px;width:100%;">EN</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
